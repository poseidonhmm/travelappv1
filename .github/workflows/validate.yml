name: Validate Wanderly catalogue and local features
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run unit and API fixture tests
        run: npm test
      - name: Validate all destination profiles
        run: npm run validate
